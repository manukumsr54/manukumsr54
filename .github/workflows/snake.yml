name: Generate contribution snake

on:
  schedule:
    - cron: "0 3 * * *"   # once a day, 03:00 UTC
  workflow_dispatch: {}    # lets you trigger it manually from the Actions tab
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: manukumsr54
          outputs: |
            assets/github-snake.svg
            assets/github-snake-dark.svg?palette=github-dark
            assets/github-snake-light.svg?palette=github-light

      - name: Push generated assets to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
