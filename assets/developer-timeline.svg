<svg width="100%" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Developer timeline from 2025 web fundamentals through 2026 to what's next">
  <defs>
    <linearGradient id="cardBg6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="100%" stop-color="#080B12"/>
    </linearGradient>
  </defs>
  <rect width="900" height="260" rx="16" fill="url(#cardBg6)" stroke="#1B2333"/>
  <text x="30" y="38" font-family="'Segoe UI', 'Fira Code', monospace" font-size="14" letter-spacing="3" fill="#22D3EE">&#9702; DEVELOPER TIMELINE</text>

  <line x1="90" y1="70" x2="90" y2="220" stroke="#334155" stroke-width="2"/>

  <g font-family="monospace" fill="#F8FAFC">
    <circle cx="90" cy="80" r="6" fill="#22D3EE"/>
    <text x="115" y="85" font-size="15" font-weight="700">2025</text>
    <text x="115" y="105" font-size="11" fill="#94A3B8">Web fundamentals</text>

    <circle cx="90" cy="150" r="6" fill="#6366F1"/>
    <text x="115" y="155" font-size="15" font-weight="700">2026</text>
    <text x="115" y="175" font-size="11" fill="#94A3B8">Advanced DSA &#8226; Backend development &#8226; Python</text>
    <text x="115" y="190" font-size="11" fill="#94A3B8">RAKSHA / SIH 2026 &#8226; early AI experimentation</text>

    <circle cx="90" cy="220" r="6" fill="#A855F7">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="115" y="225" font-size="15" font-weight="700">NEXT</text>
    <text x="115" y="243" font-size="11" fill="#94A3B8">Full-Stack Software Engineering</text>
  </g>

  <text x="600" y="240" font-family="monospace" font-size="10" fill="#64748B" text-anchor="middle">exact dates for earlier milestones: [DATE]</text>
</svg>
