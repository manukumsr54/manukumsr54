<svg width="100%" height="180" viewBox="0 0 900 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Engineering pipeline: idea, research, design, implement, test, debug, deploy, iterate">
  <defs>
    <linearGradient id="cardBg5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="100%" stop-color="#080B12"/>
    </linearGradient>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="900" height="180" rx="16" fill="url(#cardBg5)" stroke="#1B2333"/>
  <text x="30" y="34" font-family="'Segoe UI', 'Fira Code', monospace" font-size="14" letter-spacing="3" fill="#22D3EE">HOW I BUILD</text>

  <g font-family="monospace" font-size="10.5" fill="#F8FAFC">
    <!-- 8 stages -->
    <g transform="translate(20,70)">
      <rect width="92" height="44" rx="7" fill="#0D1117" stroke="#22D3EE"/>
      <text x="46" y="27" text-anchor="middle">IDEA</text>
    </g>
    <g transform="translate(128,70)">
      <rect width="92" height="44" rx="7" fill="#0D1117" stroke="#22D3EE"/>
      <text x="46" y="27" text-anchor="middle">RESEARCH</text>
    </g>
    <g transform="translate(236,70)">
      <rect width="92" height="44" rx="7" fill="#0D1117" stroke="#6366F1"/>
      <text x="46" y="27" text-anchor="middle">DESIGN</text>
    </g>
    <g transform="translate(344,70)">
      <rect width="98" height="44" rx="7" fill="#0D1117" stroke="#6366F1"/>
      <text x="49" y="27" text-anchor="middle">IMPLEMENT</text>
    </g>
    <g transform="translate(458,70)">
      <rect width="92" height="44" rx="7" fill="#0D1117" stroke="#A855F7"/>
      <text x="46" y="27" text-anchor="middle">TEST</text>
    </g>
    <g transform="translate(566,70)">
      <rect width="92" height="44" rx="7" fill="#0D1117" stroke="#A855F7"/>
      <text x="46" y="27" text-anchor="middle">DEBUG</text>
    </g>
    <g transform="translate(674,70)">
      <rect width="92" height="44" rx="7" fill="#0D1117" stroke="#38BDF8"/>
      <text x="46" y="27" text-anchor="middle">DEPLOY</text>
    </g>
    <g transform="translate(782,70)">
      <rect width="96" height="44" rx="7" fill="#0D1117" stroke="#38BDF8"/>
      <text x="48" y="27" text-anchor="middle">ITERATE</text>
    </g>
  </g>

  <g stroke="#334155" stroke-width="1.6" marker-end="url(#arrow2)">
    <line x1="112" y1="92" x2="126" y2="92"/>
    <line x1="220" y1="92" x2="234" y2="92"/>
    <line x1="328" y1="92" x2="342" y2="92"/>
    <line x1="442" y1="92" x2="456" y2="92"/>
    <line x1="550" y1="92" x2="564" y2="92"/>
    <line x1="658" y1="92" x2="672" y2="92"/>
    <line x1="766" y1="92" x2="780" y2="92"/>
  </g>
  <path d="M878,92 C900,130 30,150 20,92" fill="none" stroke="#1B2333" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#arrow2)"/>
</svg>
