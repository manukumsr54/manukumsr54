<svg width="100%" height="280" viewBox="0 0 1000 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Manu Kumar — Developer System Online. CSE Student, Full-Stack Developer in progress.">
  <defs>
    <linearGradient id="bgDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070B"/>
      <stop offset="55%" stop-color="#080B12"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="titleGlowDark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="55%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <radialGradient id="coreGlowDark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gridDark" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#1B2333" stroke-width="1"/>
    </pattern>
    <clipPath id="clipDark"><rect width="1000" height="280" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#clipDark)">
    <rect width="1000" height="280" fill="url(#bgDark)"/>
    <rect width="1000" height="280" fill="url(#gridDark)" opacity="0.55"/>

    <!-- scanline -->
    <rect x="0" y="0" width="1000" height="2" fill="#22D3EE" opacity="0.18">
      <animate attributeName="y" values="0;280;0" dur="9s" repeatCount="indefinite"/>
    </rect>

    <!-- orbiting node, left side -->
    <g transform="translate(120,140)">
      <circle r="70" fill="url(#coreGlowDark)"/>
      <circle r="46" fill="none" stroke="#22D3EE" stroke-opacity="0.35" stroke-width="1"/>
      <circle r="30" fill="none" stroke="#6366F1" stroke-opacity="0.3" stroke-width="1"/>
      <circle r="6" fill="#22D3EE">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <g>
        <circle cx="46" cy="0" r="3.4" fill="#A855F7"/>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="11s" repeatCount="indefinite"/>
      </g>
      <g>
        <circle cx="0" cy="-30" r="2.6" fill="#22D3EE"/>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="7s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- identity block -->
    <text x="230" y="118" font-family="'Segoe UI', 'Fira Code', monospace" font-size="13" letter-spacing="4" fill="#22D3EE" opacity="0.85">DEVELOPER SYSTEM ONLINE</text>
    <text x="230" y="168" font-family="'Segoe UI', 'Fira Code', monospace" font-size="48" font-weight="700" fill="url(#titleGlowDark)">MANU KUMAR</text>
    <text x="230" y="198" font-family="'Segoe UI', 'Fira Code', monospace" font-size="15" letter-spacing="2" fill="#94A3B8">CSE STUDENT &#8226; FULL-STACK DEVELOPER IN PROGRESS</text>

    <!-- status strip -->
    <g transform="translate(230,222)" font-family="'Segoe UI', 'Fira Code', monospace" font-size="12">
      <rect x="0" y="0" width="560" height="36" rx="8" fill="#0D1117" stroke="#1B2333"/>
      <circle cx="20" cy="18" r="4" fill="#22C55E">
        <animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="32" y="22" fill="#F8FAFC" letter-spacing="1">BUILDING <tspan fill="#94A3B8">Full-Stack</tspan></text>
      <circle cx="220" cy="18" r="4" fill="#22D3EE">
        <animate attributeName="opacity" values="1;0.35;1" dur="2.1s" repeatCount="indefinite"/>
      </circle>
      <text x="232" y="22" fill="#F8FAFC" letter-spacing="1">LEARNING <tspan fill="#94A3B8">C++ / DSA</tspan></text>
      <circle cx="420" cy="18" r="4" fill="#A855F7">
        <animate attributeName="opacity" values="1;0.35;1" dur="2.5s" repeatCount="indefinite"/>
      </circle>
      <text x="432" y="22" fill="#F8FAFC" letter-spacing="1">EXPLORING <tspan fill="#94A3B8">Python / AI</tspan></text>
    </g>
  </g>
</svg>
