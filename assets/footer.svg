<svg width="100%" height="150" viewBox="0 0 1000 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Footer: system status continuously learning">
  <defs>
    <linearGradient id="bgFooter" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#080B12"/>
      <stop offset="50%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#080B12"/>
    </linearGradient>
    <clipPath id="clipFooter"><rect width="1000" height="150" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#clipFooter)">
    <rect width="1000" height="150" fill="url(#bgFooter)"/>

    <!-- flowing data line -->
    <path d="M0,90 C150,40 250,140 400,90 C550,40 650,140 800,90 C900,60 950,90 1000,80" fill="none" stroke="#22D3EE" stroke-width="1.6" opacity="0.5">
      <animate attributeName="stroke-dashoffset" from="0" to="-1000" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dasharray" values="6 10" dur="0.01s" repeatCount="indefinite"/>
    </path>

    <!-- small orbit -->
    <g transform="translate(60,75)">
      <circle r="16" fill="none" stroke="#6366F1" stroke-opacity="0.5"/>
      <circle r="3" fill="#A855F7">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- terminal cursor + text -->
    <text x="110" y="70" font-family="'Fira Code', monospace" font-size="13" letter-spacing="2" fill="#22D3EE">SYSTEM STATUS // CONTINUOUSLY LEARNING</text>
    <rect x="418" y="59" width="9" height="14" fill="#22D3EE">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>

    <text x="110" y="98" font-family="'Segoe UI', monospace" font-size="12" fill="#94A3B8">Built with curiosity, code, and a lot of debugging.</text>
  </g>
</svg>
